# version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ghosttalk_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: ghosttalk_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./backend:/usr/src/app
      - cargo_registry_cache:/usr/local/cargo/registry
      - cargo_git_cache:/usr/local/cargo/git
      - cargo_target_cache:/usr/src/app/target
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: "actix_web=debug,chatapp_by_aarchangel_backend=debug,sqlx=warn,system_events=info,user_events=debug,admin_events=debug,jsonwebtoken=info"
      RUST_BACKTRACE: "1"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES}
      FEATURE_SIGNUP_ENABLED: ${FEATURE_SIGNUP_ENABLED:-true}
      FEATURE_LOGIN_ENABLED: ${FEATURE_LOGIN_ENABLED:-true}
    command: ["cargo", "watch", "-c", "-w", "src", "-w", "Cargo.toml", "--poll", "--delay", "1", "-s", "sh -c 'stdbuf -oL cargo run --bin chatapp_by_aarchangel_backend'"]
    restart: unless-stopped
    labels:
      - "com.ghosttalk.description=GhostTalk Backend API"
      - "com.ghosttalk.version=0.1.0"

volumes:
  pgdata:
    driver: local
  cargo_registry_cache:
    driver: local
  cargo_git_cache:
    driver: local
  cargo_target_cache:
    driver: local 