# /home/aarchangel/Desktop/chatapp_project/docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ghosttalk_db
    environment:
      POSTGRES_USER: aarchangel
      POSTGRES_PASSWORD: Aslam786@
      POSTGRES_DB: chatapp_by_aarchangel_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432" # Host port 5433 maps to container port 5432
    restart: unless-stopped
    networks:
      - ghosttalk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aarchangel -d chatapp_by_aarchangel_db"]
      interval: 5s # Check every 5 seconds
      timeout: 5s  # Timeout after 5 seconds
      retries: 5   # Retry 5 times before considering unhealthy

  redis:
    image: redis:7-alpine
    container_name: ghosttalk_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ghosttalk_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: . # This refers to the directory where Dockerfile.migrations is located
      dockerfile: Dockerfile.migrations # Point to your new Dockerfile
    environment:
      # This DATABASE_URL connects to the 'db' service within the Docker network
      DATABASE_URL: postgres://aarchangel:Aslam786%40@db:5432/chatapp_by_aarchangel_db
    volumes:
      # Mount your local migrations directory into the container
      - ./services/auth-api/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy # Ensures db is ready before migrations run
    command: sqlx migrate run # This is the command to actually run the migrations

  auth-api:
    build:
      context: . # Build context is the project root to access files like services/auth-api
      dockerfile: infra/docker/auth-api.Dockerfile # Corrected path to your Dockerfile
    container_name: ghosttalk_auth_api
    mem_limit: 2g
    networks:
      - ghosttalk_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations: # Make sure auth-api starts after migrations have successfully completed
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aarchangel:Aslam786%40@db:5432/chatapp_by_aarchangel_db
      REDIS_URL: "redis://redis:6379"
      RUST_LOG: "debug,actix_web=debug,auth-api=debug,sqlx=debug"
      RUST_BACKTRACE: "1"
      JWT_SECRET: "2/S3udAXVmtIPKiTAVF/EVCxlQ7bNbW9KquF4kbyOdU=" # IMPORTANT: Use a secure, generated secret in production!
      JWT_EXPIRY_MINUTES: "60"
      FEATURE_SIGNUP_ENABLED: "true"
      FEATURE_LOGIN_ENABLED: "true"
    restart: unless-stopped
    labels:
      - "com.ghosttalk.description=GhostTalk Auth API"
      - "com.ghosttalk.version=0.1.0"

networks:
  ghosttalk_net:
    driver: bridge

volumes:
  pgdata:
    driver: local