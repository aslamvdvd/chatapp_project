[package]
name = "chatapp_by_aarchangel_backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
validator = { version = "0.16", features = ["derive"] }
argon2 = "0.5"
rand = "0.8" # For generating salt
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "macros"] }
dotenvy = "0.15"
thiserror = "1.0" # Added for custom error handling
utoipa = { version = "4.0", features = ["actix_extras", "chrono", "uuid"] } # Updated version and features
utoipa-swagger-ui = { version = "4.0", features = ["actix-web"] } # Corrected feature name
base64 = "0.22" # Or the latest version

jsonwebtoken = "9" # For JWT handling

# Logging dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "registry", "env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-actix-web = "0.7" # Added for Actix Web integration

# For password hashing, argon2 needs a random number generator for salt
# rand_core = { version = "0.6", features = ["std"] } # argon2 pulls this in via rand
