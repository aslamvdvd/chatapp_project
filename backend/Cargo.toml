[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0" # Though serde derive is usually covered by the "derive" feature of serde
dotenvy = "0.15"
log = "0.4"
env_logger = "0.10"

# For password hashing
argon2 = "0.5"
rand = "0.8"

# For email regex & validation (optional but useful)
validator = { version = "0.16", features = ["derive"] }

# For time handling (e.g., dob)
chrono = { version = "0.4", features = ["serde"] }

# For working with UUIDs
uuid = { version = "1", features = ["v4", "serde"] }
